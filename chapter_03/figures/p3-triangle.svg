<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif" font-size="18">
  <!-- The element T with vertices a1, a2, a3, two points on each edge at the
       parameters 1/3 and 2/3, and the barycenter. -->
  <polygon points="60,250 340,250 200,40"
           fill="#9ca3af" fill-opacity="0.12"
           stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Vertex degrees of freedom. -->
  <g fill="#0ea5e9">
    <circle cx="60" cy="250" r="7"/>
    <circle cx="340" cy="250" r="7"/>
    <circle cx="200" cy="40" r="7"/>
  </g>

  <!-- Two degrees of freedom on each edge. -->
  <g fill="#d946ef">
    <circle cx="153.3" cy="250" r="7"/>
    <circle cx="246.7" cy="250" r="7"/>
    <circle cx="293.3" cy="180" r="7"/>
    <circle cx="246.7" cy="110" r="7"/>
    <circle cx="153.3" cy="110" r="7"/>
    <circle cx="106.7" cy="180" r="7"/>
  </g>

  <!-- Interior degree of freedom at the barycenter. -->
  <circle cx="200" cy="180" r="7" fill="#f59e0b"/>

  <g fill="currentColor" font-style="italic">
    <text x="36" y="274">a<tspan font-size="12" dy="4">1</tspan></text>
    <text x="348" y="274">a<tspan font-size="12" dy="4">2</tspan></text>
    <text x="192" y="28">a<tspan font-size="12" dy="4">3</tspan></text>
    <text x="210" y="176">a<tspan font-size="12" dy="4">123</tspan></text>
  </g>

  <text x="200" y="292" text-anchor="middle" fill="currentColor" font-size="16">
    10 degrees of freedom
  </text>
</svg>
