version: 1

project:
  title: TMA4220 — Numerical Solution of Partial Differential Equations Using the Finite Element Method
  short_title: TMA4220
  description: >-
    Learning material for the course TMA4220 Solving partial differential equations with the finite element method taught
    at the Department of Mathematical Sciences, NTNU.
  keywords:
    - finite element method
    - partial differential equations
    - numerical analysis
    - NTNU
  authors:
    - name: André Massing
      affiliations:
        - Department of Mathematical Sciences, NTNU

  # Enable in-page code execution backed by JupyterLite (runs in the browser).
  jupyter:
    lite: true

  toc:
    - file: lecture_01.ipynb
    # - file: lecture-plan.md
    - title: Notebooks
      children:
        - file: notebooks/functional_analysis.md
        - file: notebooks/lax_milgram.md
        - file: notebooks/function_spaces.md
        # - file: notebooks/function-plot-markdown.md
        # - file: notebooks/function-plot-markdown.md

  math:
    # Note the 'single quotes'
    '\dobs': '\mathbf{d}_\text{obs}'
    '\dpred': '\mathbf{d}_\text{pred}\left( #1 \right)'
    '\mref': '\mathbf{m}_\text{ref}'

    # Macros ported from notation.sty
    # Operators
    '\Div': '\mathrm{div}'
    '\Grad': '\mathrm{grad}'
    '\Curl': '\mathrm{curl}'
    '\Rot': '\mathrm{rot}'
    '\ord': '\mathrm{ord}'
    '\Kern': '\mathrm{ker}'
    '\Image': '\mathrm{im}'
    '\spann': '\mathrm{span}'
    '\dist': '\mathrm{dist}'
    '\diam': '\mathrm{diam}'
    '\sig': '\mathrm{sig}'
    '\convex': '\mathrm{convex}'

    # Blackboard-bold sets
    '\CC': '\mathbb{C}'
    '\VV': '\mathbb{V}'
    '\RR': '\mathbb{R}'
    '\NN': '\mathbb{N}'
    '\PP': '\mathbb{P}'
    '\ZZ': '\mathbb{Z}'
    '\PPc': '\mathbb{P}^{\mathrm{c}}'
    '\PPdc': '\mathbb{P}^{\mathrm{dc}}'

    # Differentials
    '\dx': '\,\mathrm{d}x'
    '\dy': '\,\mathrm{d}y'
    '\ds': '\,\mathrm{d}s'
    '\dt': '\,\mathrm{d}t'
    '\dS': '\,\mathrm{d}S'
    '\dV': '\,\mathrm{d}V'
    '\dX': '\,\mathrm{d}X'
    '\dY': '\,\mathrm{d}Y'
    '\dE': '\,\mathrm{d}E'
    '\dK': '\,\mathrm{d}K'
    '\dM': '\,\mathrm{d}M'
    '\dU': '\,\mathrm{d}U'
    '\dGamma': '\,\mathrm{d} \Gamma'
    '\cd': '\mathrm{cd}'

    # Bold vectors/matrices
    '\bfP': '\mathbf{P}'
    '\bfx': '\mathbf{x}'
    '\bfy': '\mathbf{y}'
    '\bfa': '\mathbf{a}'
    '\bfb': '\mathbf{b}'
    '\bfu': '\mathbf{u}'
    '\bfv': '\mathbf{v}'
    '\bfe': '\mathbf{e}'
    '\bfg': '\mathbf{g}'
    '\bfn': '\mathbf{n}'
    '\bff': '\mathbf{f}'
    '\bfp': '\mathbf{p}'
    '\bft': '\mathbf{t}'
    '\bfj': '\mathbf{j}'
    '\bfB': '\mathbf{B}'
    '\bfV': '\mathbf{V}'
    '\bfE': '\mathbf{E}'
    '\bfK': '\mathbf{K}'

    # Roman/calligraphic
    '\mrm': '\mathrm{ #1 }'
    # '\dpred': '\mathbf{d}_\text{pred}\left( #1 \right)'
    '\mcA': '\mathcal{A}'
    '\mcK': '\mathcal{K}'
    '\mcT': '\mathcal{T}'
    '\mcF': '\mathcal{F}'
    '\mcP': '\mathcal{P}'
    '\mcO': '\mathcal{O}'

    # Jumps and averages (DG notation)
    '\jump': '[\![#1]\!]'
    '\avg': '\{\!\!\{ #1 \}\!\!\}'
    '\wavg': '\{\!\!\{ #1 \}\!\!\}_{\omega}'
    '\wavgd': '\langle\!\langle {#1} \rangle\!\rangle_{\omega}'
    '\jumps': '[#1]'
    '\avgs': '\{{#1} \}'

    # Misc
    '\st': '\;|\;'
    '\foralls': '\forall\,'
    '\onehalf': '\nicefrac{1}{2}'


site:
  template: book-theme
  options:
    folders: true
